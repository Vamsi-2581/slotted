# The product's own installation. `@nexora/*` link by workspace; `@slotted/*`
# arrive as tarballs from ../.registry, written by `pnpm pack:beta` at the
# repository root.
packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
