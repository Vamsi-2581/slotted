<!--
  The stepper glyphs are masks from the theme's own glyph scale, so nothing
  here draws a character as an icon. The adornment marks are text, which is
  what an adornment is when it is not a glyph.

  The DOM differs by arrangement on purpose: under `stacked` the two buttons
  share a `stepper` box after the value; under `split` they are direct children
  of the frame, decrement first and increment last, so the reading order and
  the painted order are the same one.
-->

<section data-scene="default">
  <div data-ui="stack" data-part="root" data-gap="6">
    <div
      data-ui="number-field"
      data-part="root"
      data-size="md"
      data-variant="outline"
      data-stepper="stacked"
    >
      <input data-part="input" type="text" role="spinbutton" value="12" aria-valuenow="12" />
      <span data-part="stepper">
        <button data-part="increment" type="button" tabindex="-1" aria-label="Aumentar"></button>
        <button data-part="decrement" type="button" tabindex="-1" aria-label="Diminuir"></button>
      </span>
    </div>
    <div
      data-ui="number-field"
      data-part="root"
      data-size="md"
      data-variant="outline"
      data-stepper="stacked"
    >
      <input data-part="input" type="text" role="spinbutton" placeholder="Quantidade" />
      <span data-part="stepper">
        <button data-part="increment" type="button" tabindex="-1" aria-label="Aumentar"></button>
        <button data-part="decrement" type="button" tabindex="-1" aria-label="Diminuir"></button>

    </div>
  </div>
</section>
